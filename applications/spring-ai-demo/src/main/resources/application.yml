spring:
  application:
    name: java-demo
  ai:
    chat:
      observations:
        log-prompt: true       # Include prompt content in tracing (disabled by default for privacy)
        log-completion: true   # Include completion content in tracing (disabled by default)
langfuse:
  environment: ${LANGFUSE_ENVIRONMENT:development}
management:
  tracing:
    sampling:
      probability: 1.0    # Sample 100% of requests for full tracing (adjust in production as needed)
  observations:
    annotations:
      enabled: true       # Enable @Observed (if you use observation annotations in code)
    enable:
      http.server.requests: false   # Keep Langfuse traces focused on AI/tool spans
      http.client.requests: false
otel:
  instrumentation:
    spring-webmvc:
      enabled: false
    spring-web:
      enabled: false
